name: Build tool bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Download RetroED and package setup guide
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sonic Lonestar
        uses: actions/checkout@v4

      - name: Download latest RetroED Windows release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/tools/RetroED bundle/docs bundle/scripts bundle/workspace/levels bundle/workspace/palettes bundle/workspace/game-data
          python3 - <<'PY'
          import json
          import urllib.request

          api = "https://api.github.com/repos/RSDKModding/RetroED/releases/latest"
          req = urllib.request.Request(api, headers={"User-Agent": "Sonic-Lonestar-GitHub-Actions"})
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)

          asset = next((a for a in release.get("assets", []) if a.get("name", "").lower() == "retroed.exe"), None)
          if asset is None:
              raise SystemExit(f"No RetroED.exe found in {release.get('html_url', 'latest release')}")
          req = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "Sonic-Lonestar-GitHub-Actions"})
          with urllib.request.urlopen(req, timeout=120) as response, open("bundle/tools/RetroED/RetroED.exe", "wb") as output:
              output.write(response.read())
          print("Downloaded RetroED", release.get("tag_name"), "from", asset["browser_download_url"])
          PY

      - name: Copy setup documentation
        run: |
          cp README.md bundle/README.md
          cp LICENSES.md bundle/LICENSES.md
          cp scripts/setup.ps1 bundle/scripts/setup.ps1
          cp docs/EDITOR_SETUP.md bundle/docs/EDITOR_SETUP.md
          cp UPSTREAMS.md bundle/UPSTREAMS.md

      - name: Package bundle
        run: |
          cd bundle
          zip -qr ../Sonic-Lonestar-toolkit.zip .

      - name: Upload downloadable toolkit
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Lonestar-toolkit
          path: Sonic-Lonestar-toolkit.zip
          if-no-files-found: error
          retention-days: 14
